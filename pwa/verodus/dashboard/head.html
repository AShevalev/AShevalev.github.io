<!--
  Paste into dashboard.verodus.com <head> (Next.js: app/layout.tsx metadata + a
  <link rel="manifest">). Without these tags Android opens a Chrome Custom Tab
  with the X / title / URL bar instead of a standalone app.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07003B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Verodus" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
