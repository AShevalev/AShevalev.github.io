<!-- Landing-page pills. href=/app is the no-JS fallback (same origin).
     JS intercepts the click and runs the install prompt on verodus.com. -->

<div class="_stores_kptsv_152">
  <a
    class="v-store-pill"
    data-install-app
    href="/app"
    aria-label="Install Verodus on Android"
  >
    <!-- keep the existing Android SVG -->
    <span data-i18n="content.span58">for android</span>
  </a>
  <a
    class="v-store-pill"
    data-install-app
    href="/app"
    aria-label="Install Verodus on iPhone"
  >
    <!-- keep the existing Apple SVG -->
    <span data-i18n="content.span59">for iOS</span>
  </a>
</div>

<link rel="stylesheet" href="/pwa/add-to-home-screen.css" />
<script type="module" src="/pwa/verodus/www/store-buttons.js"></script>
