<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download PDF — Joe Wong briefing</title>
  <style>
    :root { --green:#0f766e; --ink:#161b22; --muted:#57606a; --soft:#f6f8fa; --rule:#d0d7de; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--ink); background: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 20px;
    }
    .card {
      width: 100%; max-width: 440px;
      background: var(--soft); border: 1px solid var(--rule);
      border-radius: 16px; padding: 36px 28px 28px;
    }
    .kicker { font-size: 12px; letter-spacing: .08em; font-weight: 600; color: var(--green); text-transform: uppercase; margin: 0 0 10px; }
    h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.25; }
    p { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    a.btn {
      display: block; text-align: center; background: var(--green); color: #fff;
      text-decoration: none; font-weight: 650; font-size: 17px;
      padding: 16px 18px; border-radius: 10px;
    }
    a.alt { display: block; margin-top: 14px; text-align: center; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">Verodus internal</p>
    <h1>Download the PDF</h1>
    <p>Joe Wong full briefing — 22 August 2026. Meeting, email, Bookmap, Kim’s notes, and terms.</p>
    <a class="btn" href="joe-wong-complete-briefing.pdf" download="Joe_Wong_Briefing.pdf">Download PDF</a>
    <a class="alt" href="joe-wong-complete-briefing.pdf" target="_blank" rel="noopener">Open in browser</a>
  </div>
</body>
</html>
